ServerName ${APACHE_SERVER_NAME}

PassEnv LAN_REDIRECT_ENABLED LAN_REDIRECT_HOST APACHE_SERVER_NAME HTTPS_PORT

<VirtualHost *:80>
    ServerName ${APACHE_SERVER_NAME}
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Require all granted
        AllowOverride All
        Options FollowSymLinks MultiViews
    </Directory>

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond "%{ENV:LAN_REDIRECT_ENABLED}" "^true$"
        RewriteCond "%{REMOTE_ADDR}" "^192\.168\." [OR]
        RewriteCond "%{REMOTE_ADDR}" "^10\."                  [OR]
        RewriteCond "%{REMOTE_ADDR}" "^172\.(1[6-9]|2[0-9]|3[01])\."
        RewriteCond "%{HTTP_HOST}"      "^${APACHE_SERVER_NAME}(:[0-9]+)?$"
        RewriteRule "(.*)" "https://${LAN_REDIRECT_HOST}:${HTTPS_PORT}$1" [R=302,L]
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName ${APACHE_SERVER_NAME}
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/tls/tls.crt
    SSLCertificateKeyFile /etc/apache2/tls/tls.key

    <Directory /var/www/html>
        Require all granted
        AllowOverride All
        Options FollowSymLinks MultiViews
    </Directory>

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond "%{ENV:LAN_REDIRECT_ENABLED}" "^true$"
        RewriteCond "%{REMOTE_ADDR}" "^192\.168\." [OR]
        RewriteCond "%{REMOTE_ADDR}" "^10\."                  [OR]
        RewriteCond "%{REMOTE_ADDR}" "^172\.(1[6-9]|2[0-9]|3[01])\."
        RewriteCond "%{HTTP_HOST}"      "^${APACHE_SERVER_NAME}(:[0-9]+)?$"
        RewriteRule "(.*)" "https://${LAN_REDIRECT_HOST}:${HTTPS_PORT}$1" [R=302,L]
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>



