services:
  db:
    image: mariadb:12.3.2
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
    volumes:
      - ${DATABASE_DATA_PATH}:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    image: nextcloud-local:33.0.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ${NEXTCLOUD_DATA_PATH}:/var/www/html
      - ${VAULT_PATH}:/var/www/redVault
      - ${TLS_CERT_PATH}:/etc/apache2/tls/tls.crt:ro
      - ${TLS_KEY_PATH}:/etc/apache2/tls/tls.key:ro
    environment:
      APACHE_SERVER_NAME: ${TLS_HOST}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      REDIS_HOST: redis
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: ${NEXTCLOUD_URL}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--insecure", "https://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  beszel:
    image: henrygd/beszel:0.18.7
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      APP_URL: ${BESZEL_URL}
    ports:
      - "${BESZEL_PORT}:8090"
    volumes:
      - ${BESZEL_DATA_PATH}:/beszel_data
      - ${BESZEL_SOCKET_PATH}:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis_data:
